<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 64" role="img" aria-label="Classifier">
    <defs>
        <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1d4ed8"/>
            <stop offset="0.5" stop-color="#0e7490"/>
            <stop offset="1" stop-color="#10b981"/>
        </linearGradient>
        <linearGradient id="texto" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1d4ed8"/>
            <stop offset="1" stop-color="#047857"/>
        </linearGradient>
    </defs>

    <!-- ícone (o mesmo de logo.svg) -->
    <rect width="64" height="64" rx="16" fill="url(#fundo)"/>
    <path d="M43.3 43.3 A16 16 0 1 1 43.3 20.7" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="43.3" cy="43.3" r="4.6" fill="#ffffff"/>
    <circle cx="43.3" cy="43.3" r="2" fill="#1d4ed8"/>
    <circle cx="16" cy="32" r="4.2" fill="#ffffff"/>
    <circle cx="16" cy="32" r="1.8" fill="#0e7490"/>
    <circle cx="43.3" cy="20.7" r="5.6" fill="#ffffff"/>
    <circle cx="43.3" cy="20.7" r="2.6" fill="#10b981"/>

    <!-- nome -->
    <text x="80" y="43" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8" fill="url(#texto)">Classifier</text>
</svg>
